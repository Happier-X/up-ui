lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@up-ui/components':
        specifier: workspace:*
        version: link:packages/components
      '@up-ui/hook':
        specifier: workspace:*
        version: link:packages/hook
      '@up-ui/utils':
        specifier: workspace:*
        version: link:packages/utils

  packages/components: {}

  packages/hook: {}

  packages/utils: {}
